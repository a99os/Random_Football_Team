<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasodifiy jamoalar</title>
    <link rel="stylesheet" href="./output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-slate-900 font-sans text-slate-100 antialiased">
    <div
      class="fixed inset-0 -z-10 bg-[url('./images/polya.webp')] bg-cover bg-center"
      aria-hidden="true"
    ></div>
    <div class="fixed inset-0 -z-10 bg-slate-900/80 backdrop-blur-sm" aria-hidden="true"></div>

    <!-- ============ entry screen ============ -->
    <main id="entry" class="mx-auto flex min-h-screen max-w-3xl flex-col justify-center px-4 py-10">
      <div class="rounded-2xl border border-white/20 bg-slate-900/70 p-6 shadow-2xl sm:p-8">
        <h1 class="text-2xl font-extrabold tracking-tight text-white sm:text-3xl">
          Tasodifiy jamoalar
        </h1>
        <p class="mt-1.5 text-sm text-slate-400">
          O'yinchilar ismini yozing, nechta jamoaga bo'linishini tanlang.
        </p>

        <form id="add-form" class="mt-6" novalidate>
          <label for="name-input" class="sr-only">O'yinchi ismi</label>
          <div class="flex gap-2">
            <input
              id="name-input"
              type="text"
              autocomplete="off"
              placeholder="Ism yozing va Enter bosing"
              class="min-w-0 flex-1 rounded-lg border border-white/20 bg-white/5 px-4 py-3 text-base text-white placeholder:text-slate-500 focus:border-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-400/40"
            />
            <button
              type="submit"
              class="shrink-0 rounded-lg bg-emerald-600 px-5 py-3 font-semibold text-white transition hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-400/60 active:bg-emerald-700"
            >
              Qo'shish
            </button>
          </div>
        </form>

        <div id="players" class="mt-4 flex flex-wrap gap-2" role="list"></div>
        <p id="empty-hint" class="mt-4 text-sm text-slate-500">Hali o'yinchi qo'shilmadi.</p>

        <div class="mt-7 border-t border-white/10 pt-6">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <span class="text-sm font-semibold text-slate-300">Nechta jamoa?</span>
            <div id="team-count" class="flex overflow-hidden rounded-lg border border-white/20" role="group"></div>
          </div>
          <p id="readout" class="mt-3 text-sm tabular-nums text-slate-400"></p>
        </div>

        <div class="mt-6 flex flex-wrap gap-3">
          <button
            id="draw"
            type="button"
            class="flex-1 rounded-lg bg-emerald-600 px-6 py-3.5 text-base font-bold uppercase tracking-wide text-white transition hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-400/60 active:bg-emerald-700 disabled:cursor-not-allowed disabled:bg-slate-700 disabled:text-slate-500"
          >
            Jamoalarga bo'lish
          </button>
          <button
            id="clear"
            type="button"
            class="rounded-lg border border-white/20 px-5 py-3.5 text-sm font-semibold text-slate-300 transition hover:border-white/40 hover:text-white focus:outline-none focus:ring-2 focus:ring-white/30"
          >
            Tozalash
          </button>
        </div>
      </div>
    </main>

    <!-- ============ results screen ============ -->
    <main id="results" class="mx-auto hidden min-h-screen max-w-6xl flex-col justify-center px-4 py-10">
      <div
        class="mb-5 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-white/20 bg-slate-900/80 px-4 py-3"
      >
        <h2 id="results-title" class="text-xl font-extrabold tracking-tight text-white sm:text-2xl"></h2>
        <div class="flex gap-2.5">
          <button
            id="reshuffle"
            type="button"
            class="rounded-lg bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-400/60 active:bg-emerald-700"
          >
            Qayta aralashtirish
          </button>
          <button
            id="back"
            type="button"
            class="rounded-lg border border-white/20 px-4 py-2.5 text-sm font-semibold text-slate-300 transition hover:border-white/40 hover:text-white focus:outline-none focus:ring-2 focus:ring-white/30"
          >
            Ismlarni o'zgartirish
          </button>
        </div>
      </div>
      <div id="teams" class="grid gap-4"></div>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
